<ion-card>
  <img [src]="event().thumbnailPath" loading="lazy" [alt]="'Security event from ' + event().cameraName" />
  <ion-card-header>
    <ion-card-title> {{ event().cameraName }}</ion-card-title>
    <ion-card-subtitle>{{ event().type }}</ion-card-subtitle>
  </ion-card-header>

  <ion-card-content>
    <p>{{ event().timestamp | date:'dd.MM.yyyy, HH:mm:ss' }}</p>
    <ion-grid>
      <ion-row>
        <ion-col>
          <ion-badge>
            {{ event().isRead ? 'Read' : 'Unread' }}
          </ion-badge>
        </ion-col>
        <ion-col>
          <ion-button [routerLink]="['/events', event().id]">
            View details
          </ion-button>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-card-content>
</ion-card>
